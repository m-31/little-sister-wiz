# The settings the library is configured with while this suite runs. `conftest.py`
# names this file before anything imports the library, which reads it once.
#
# One key, the only one a line of this package reads: an issue's line says when WIZ
# detected the issue and when it is due on this zone's clock. Kathmandu, because no
# machine that runs the suite is there: its clock is three quarters of an hour off
# every clock that stands on a whole hour, and it keeps no summer time — so a clock
# time a test states is this zone's on any machine, on any day of the year.
timezone: Asia/Kathmandu
